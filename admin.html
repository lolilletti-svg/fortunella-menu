<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fortunella — Panel del Menú</title>
  <style>
    :root {
      --navy: #0F2560;
      --orange: #E5532A;
      --cream: #FBF6EC;
      --cream2: #F3EADb;
      --line: rgba(15,37,96,0.18);
      --ok: #2E7D32;
      --danger: #C62828;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--cream); color: var(--navy);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      font-size: 15px; line-height: 1.4;
    }
    header.bar {
      position: sticky; top: 0; z-index: 10;
      background: var(--navy); color: #fff;
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px; gap: 12px;
    }
    header.bar h1 { font-size: 17px; margin: 0; font-weight: 700; }
    header.bar .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .wrap { max-width: 820px; margin: 0 auto; padding: 16px; }

    button {
      font: inherit; cursor: pointer; border: none; border-radius: 8px;
      padding: 8px 14px; background: var(--navy); color: #fff; font-weight: 600;
    }
    button.ghost { background: transparent; color: var(--navy); border: 1px solid var(--line); }
    button.orange { background: var(--orange); }
    button.danger { background: var(--danger); }
    button.sm { padding: 5px 10px; font-size: 13px; }
    button:disabled { opacity: 0.5; cursor: default; }
    header.bar button.ghost { color: #fff; border-color: rgba(255,255,255,0.4); }

    input, select, textarea {
      font: inherit; width: 100%; padding: 9px 10px; border: 1px solid var(--line);
      border-radius: 8px; background: #fff; color: var(--navy);
    }
    label { display: block; font-size: 12px; font-weight: 700; opacity: 0.7; margin: 10px 0 4px; text-transform: uppercase; letter-spacing: 0.4px; }

    /* Login */
    .login { max-width: 360px; margin: 12vh auto; padding: 28px 24px; background: #fff; border-radius: 14px; border: 1px solid var(--line); }
    .login h2 { margin: 0 0 4px; }
    .login p { margin: 0 0 18px; font-size: 14px; opacity: 0.7; }
    .msg { font-size: 14px; margin-top: 10px; min-height: 20px; }
    .msg.err { color: var(--danger); }
    .msg.ok { color: var(--ok); }

    /* Módulos */
    .module {
      background: #fff; border: 1px solid var(--line); border-radius: 12px;
      margin-bottom: 14px; overflow: hidden;
    }
    .module-head {
      display: flex; align-items: center; gap: 8px; padding: 12px 14px;
      background: var(--cream2); cursor: pointer;
    }
    .module-head .name { font-weight: 800; font-size: 16px; flex: 1; }
    .module-head .count { font-size: 13px; opacity: 0.6; }
    .module-body { padding: 14px; display: none; }
    .module.open .module-body { display: block; }
    .module-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; margin-bottom: 14px; }
    .module-fields .full { grid-column: 1 / -1; }

    .item {
      display: flex; align-items: center; gap: 10px; padding: 10px 0;
      border-top: 1px dashed var(--line);
    }
    .item .info { flex: 1; min-width: 0; }
    .item .iname { font-weight: 700; }
    .item .iprices { font-size: 13px; color: var(--orange); }
    .item .isub { font-size: 12px; opacity: 0.55; }
    .item .move { display: flex; flex-direction: column; gap: 2px; }
    .item .move button { padding: 1px 7px; font-size: 12px; background: var(--cream2); color: var(--navy); }

    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }

    /* Modal */
    .overlay { position: fixed; inset: 0; background: rgba(15,37,96,0.45); display: none; align-items: flex-start; justify-content: center; padding: 20px; z-index: 50; overflow-y: auto; }
    .overlay.show { display: flex; }
    .modal { background: var(--cream); border-radius: 14px; padding: 20px; width: 100%; max-width: 520px; margin-top: 4vh; }
    .modal h3 { margin: 0 0 6px; }
    .price-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
    .price-row input.lbl { flex: 1; }
    .price-row input.val { width: 120px; }
    .price-row button { background: var(--cream2); color: var(--danger); }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
    .check { display: flex; align-items: center; gap: 8px; margin-top: 14px; }
    .check input { width: auto; }
    .modal-actions { display: flex; justify-content: space-between; gap: 8px; margin-top: 20px; }

    @media (max-width: 520px) {
      .module-fields, .row2 { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <!-- LOGIN -->
  <div id="login-view" class="login" style="display:none;">
    <h2>Panel del Menú</h2>
    <p>Fortunella · ingresá la contraseña para editar.</p>
    <form id="login-form">
      <label for="pw">Contraseña</label>
      <input id="pw" type="password" autocomplete="current-password" required>
      <div style="margin-top:16px;"><button type="submit" style="width:100%;">Entrar</button></div>
      <div id="login-msg" class="msg"></div>
    </form>
  </div>

  <!-- APP -->
  <div id="app-view" style="display:none;">
    <header class="bar">
      <h1>Menú Fortunella</h1>
      <div class="actions">
        <a href="index.html" target="_blank"><button class="ghost sm">Ver menú ↗</button></a>
        <button id="add-module" class="orange sm">+ Módulo</button>
        <button id="logout" class="ghost sm">Salir</button>
      </div>
    </header>
    <div class="wrap">
      <div id="global-msg" class="msg"></div>
      <div id="modules"></div>
    </div>
  </div>

  <!-- CONFIG WARNING -->
  <div id="config-view" class="login" style="display:none;">
    <h2>Falta configurar Supabase</h2>
    <p>Completá <code>js/config.js</code> con la URL del proyecto y la anon key para activar el panel.</p>
  </div>

  <!-- MODAL ITEM -->
  <div id="item-overlay" class="overlay">
    <div class="modal">
      <h3 id="item-modal-title">Ítem</h3>
      <label>Nombre</label>
      <input id="f-name">
      <label>Descripción / ingredientes</label>
      <textarea id="f-desc" rows="2"></textarea>
      <div class="row2">
        <div>
          <label>Subgrupo (opcional)</label>
          <input id="f-subgroup" list="subgroup-list">
          <datalist id="subgroup-list"></datalist>
        </div>
        <div>
          <label>Nota inline (opcional)</label>
          <input id="f-note" placeholder="ej. + alioli $600">
        </div>
      </div>
      <label>Precios</label>
      <div id="prices"></div>
      <button id="add-price" class="ghost sm" type="button">+ Agregar precio</button>
      <div class="check" id="featured-wrap">
        <input type="checkbox" id="f-featured">
        <label for="f-featured" style="margin:0;text-transform:none;letter-spacing:0;opacity:1;">Destacado (Box / caja especial)</label>
      </div>
      <div class="modal-actions">
        <button id="item-delete" class="danger">Borrar</button>
        <div style="display:flex;gap:8px;">
          <button id="item-cancel" class="ghost">Cancelar</button>
          <button id="item-save" class="orange">Guardar</button>
        </div>
      </div>
      <div id="item-msg" class="msg"></div>
    </div>
  </div>

  <script type="module" src="js/admin.js"></script>
</body>
</html>
